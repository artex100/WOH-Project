name: Build and Deploy to External Pages Repo

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install Dependencies and Build
        run: |
          npm ci
          npm run build

      - name: Deploy to Separate Pages Repository
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PAGES }}
          repository-name: artex100/artex100.github.io
          branch: main
          folder: dist
          target-folder: /woh